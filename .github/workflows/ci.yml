name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: bun test
        run: bun test
      - name: typecheck core
        run: cd packages/core && bun run typecheck
      - name: typecheck collectors
        run: cd packages/collectors && bun run typecheck
      - name: typecheck pipeline
        run: cd packages/pipeline && bun run typecheck
      - name: typecheck web
        run: cd packages/web && bun run typecheck
