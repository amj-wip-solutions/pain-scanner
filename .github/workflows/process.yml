name: process

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun --filter @painradar/pipeline run process
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLUSTER_SIMILARITY_THRESHOLD: ${{ vars.CLUSTER_SIMILARITY_THRESHOLD }}
          CLUSTER_KEYWORD_OVERLAP_MIN: ${{ vars.CLUSTER_KEYWORD_OVERLAP_MIN }}
          CLUSTER_TOOL_OVERLAP_REQUIRED: ${{ vars.CLUSTER_TOOL_OVERLAP_REQUIRED }}
